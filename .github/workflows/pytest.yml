name: CI Pytest - UI & API Suite

on:
  push:
    branches: [ "*" ]  # Se ejecuta cuando haces push a cualquier rama
  pull_request:
    branches: [ main ] # Se ejecuta cuando abres un Pull Request hacia main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código al servidor de GitHub
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Ejecutar pruebas con Pytest
      run: |
        pytest -v